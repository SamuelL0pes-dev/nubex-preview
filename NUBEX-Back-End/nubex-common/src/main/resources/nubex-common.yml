# Configuração padrão compartilhada pelos 5 serviços.
# Cada serviço importa este arquivo no próprio application.yml
# (spring.config.import) e pode sobrescrever qualquer valor.
#
# Regra: o padrão é o mais SEGURO (Swagger desligado, CORS fechado).
# O perfil dev abre o que é necessário para desenvolver.

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

nubex:
  cors:
    # Lista separada por vírgula. Vazio = nenhuma origem permitida.
    allowed-origins: ${CORS_ORIGINS:}

---
spring:
  config:
    activate:
      on-profile: dev

nubex:
  cors:
    # 5173 = site público; 5174 = painel administrativo (ajustar se a porta for outra)
    allowed-origins: http://localhost:5173,http://localhost:5174

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    br.edu.unifor.nubex: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

nubex:
  cors:
    # Sem valor padrão de propósito: se a variável faltar, a aplicação não sobe.
    allowed-origins: ${CORS_ORIGINS}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    br.edu.unifor.nubex: INFO
