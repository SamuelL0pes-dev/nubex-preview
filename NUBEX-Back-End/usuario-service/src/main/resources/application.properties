spring.application.name=usuario-service
server.port=8081
spring.config.import=classpath:nubex-common.yml
spring.profiles.default=dev

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

# Chave privada que assina o token do login (RF073, RNF013). So este servico a
# recebe, porque e o unico que faz login. Os outros quatro ficam apenas com a
# chave publica, declarada no nubex-common.yml, que confere e nao produz
# assinatura. Vazio = o login responde 503 e a aplicacao sobe normalmente.
nubex.jwt.chave-privada=${JWT_CHAVE_PRIVADA:}

# Rotas abertas do servico: quem vai fazer login ou pedir acesso ainda nao tem
# token. Listadas aqui, e nao espalhadas pelos controllers, para ficarem todas
# num lugar so. A lista cresce com as outras rotas de cadastro do Apendice B:
# /participante, /confirmar-email e /solicitante-externo.
nubex.security.public-routes=POST /api/auth/login,POST /api/cadastro/solicitante
