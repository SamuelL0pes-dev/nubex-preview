name: Backend
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    name: Backend - testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: NUBEX-Back-End
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Conferir Docker para os testes com Testcontainers
        run: docker info
      - name: Compilar e testar todos os módulos ativos
        run: sh mvnw -B -ntp clean verify
      - name: Guardar relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-testes
          path: NUBEX-Back-End/**/target/surefire-reports/
          if-no-files-found: warn
  compose:
    name: Compose - banco e servicos
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: NUBEX-Back-End
    env:
      # Credencial descartável, exclusiva do ambiente temporário deste job.
      POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-compose
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuração
        run: docker compose config --quiet
      - name: Iniciar banco e os cinco serviços ativos
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Conferir a saúde das APIs
        run: |
          curl --fail --silent http://127.0.0.1:8081/actuator/health
          curl --fail --silent http://127.0.0.1:8082/actuator/health
          curl --fail --silent http://127.0.0.1:8083/actuator/health
          curl --fail --silent http://127.0.0.1:8084/actuator/health
          curl --fail --silent http://127.0.0.1:8085/actuator/health
      - name: Mostrar diagnóstico em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remover o ambiente temporário do CI
        if: always()
        run: docker compose down --volumes
